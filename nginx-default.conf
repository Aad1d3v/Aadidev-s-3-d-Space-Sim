# Serves Aadidev's 3-D Space Sim (a single static HTML file).
# Used by the Dockerfile — replaces the stock default server block.
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/html application/javascript text/css application/json;

    location / {
        # The page and its bundled planet textures are static and self-contained,
        # so a little browser caching is safe.
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
